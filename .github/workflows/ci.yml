name: CI

on:
  push:
    branches: [main, release/payload-v4-next]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No version here: the action reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: node --test scripts/release-target.test.mjs
