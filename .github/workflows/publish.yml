name: Publish to npm

# Runs when a version tag (v0.1.1) is pushed. The tag must match package.json.
# npm trusts this workflow through OIDC (trusted publishing), so no token is stored.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jon8800/payload-workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # pnpm pack builds and applies publishConfig, so the tarball points at dist/.
      # npm publishes the tarball as it is, with provenance from this workflow.
      - run: pnpm pack

      - run: npm install -g npm@latest

      - run: npm publish ./payload-workflows-*.tgz --access public --provenance
