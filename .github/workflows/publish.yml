name: Publish to npm

# Runs when a version tag (v0.1.1) is pushed. The tag must match package.json.
# npm trusts this workflow through OIDC (trusted publishing), so no token is stored.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jon8800/payload-workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check version tag and npm channel
        id: release
        run: node scripts/release-target.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: node --test scripts/release-target.test.mjs

      # pnpm pack builds and applies publishConfig, so the tarball points at dist/.
      # npm publishes the tarball as it is, with provenance from this workflow.
      - run: pnpm pack

      - run: npm install -g npm@latest

      - run: npm publish "${{ steps.release.outputs.filename }}" --access public --provenance --tag "${{ steps.release.outputs.tag }}"
